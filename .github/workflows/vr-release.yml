name: VR release

# Builds the VR release of this ScummVM fork for Linux (x86_64, arm64) and
# Windows (x86_64) and publishes it as a GitHub release.
#
# Release: push a tag vr<major>.<year>.<month>.<day>[.<n>], for example
#   git tag vr1.2026.10.29 && git push origin vr1.2026.10.29
# Dry run: start the workflow by hand from the Actions tab (nothing is released).
#
# Only the engines that have VR support are built (see ENGINES below), so the
# release stays small. To add a game, add its engine to ENGINES and, if it needs
# libraries the Windows job does not build yet, add them there.

on:
  push:
    tags:
      - 'vr[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Space separated engine names with VR support, as given to configure --enable-engine=
  ENGINES: myst3
  CONFIGURE_FLAGS: --disable-all-engines --enable-openxr --enable-release
  # Versions of the libraries that are built from source, so every release is reproducible
  OPENXR_VERSION: 1.1.40
  SDL2_VERSION: 2.30.9
  ZLIB_VERSION: 1.3.1
  JPEG_TURBO_VERSION: 3.0.4
  FREETYPE_VERSION: 2-13-3

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! echo "$GITHUB_REF_NAME" | grep -Eq '^vr[0-9]+\.[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not of the form vr<major>.<year>.<month>.<day>[.<n>]"
              exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=vr-dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git pkg-config \
            libsdl2-dev libgl-dev libx11-dev libjpeg-dev zlib1g-dev libfreetype-dev
      - name: Build the OpenXR loader
        run: |
          git clone --depth 1 --branch "release-$OPENXR_VERSION" https://github.com/KhronosGroup/OpenXR-SDK.git "$RUNNER_TEMP/OpenXR-SDK"
          cmake -S "$RUNNER_TEMP/OpenXR-SDK" -B "$RUNNER_TEMP/OpenXR-SDK/build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_API_LAYERS=OFF -DBUILD_CONFORMANCE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/openxr" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/OpenXR-SDK/build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/OpenXR-SDK/build"
      - name: Configure
        run: |
          mkdir build && cd build
          ENGINE_FLAGS=$(printf -- '--enable-engine=%s ' $ENGINES)
          ../configure --prefix=/usr $CONFIGURE_FLAGS $ENGINE_FLAGS --with-openxr-prefix="$HOME/openxr"
      - name: Build
        run: make -C build -j"$(nproc)"
      - name: Check the build
        run: |
          cd build
          ./scummvm --version
          grep -aq 'OpenXR: initialised' scummvm
      - name: Package
        run: |
          cd build
          # DIST_FILES_ENGINEDATA_BIG is only fonts-cjk.dat, 38 MB of CJK fonts that are not needed
          make install-strip DESTDIR="$PWD/stage" DIST_FILES_ENGINEDATA_BIG=
          tar -C stage -czf "../scummvm-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: scummvm-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 cmake make git curl zip pkg-config
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      - name: Build the libraries
        run: |
          export DEPS="$HOME/win-deps" SRC="$RUNNER_TEMP/win-src"
          mkdir -p "$DEPS" "$SRC" && cd "$SRC"
          CMAKE_WIN="-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$DEPS -DCMAKE_INSTALL_LIBDIR=lib"

          # SDL2 (prebuilt development package)
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-devel-$SDL2_VERSION-mingw.tar.gz" | tar xz
          make -C "SDL2-$SDL2_VERSION" install-package arch=x86_64-w64-mingw32 prefix="$DEPS"

          # OpenXR loader, a DLL that is shipped with the game
          git clone --depth 1 --branch "release-$OPENXR_VERSION" https://github.com/KhronosGroup/OpenXR-SDK.git
          cmake -S OpenXR-SDK -B OpenXR-SDK/build $CMAKE_WIN -DDYNAMIC_LOADER=ON \
            -DBUILD_TESTS=OFF -DBUILD_API_LAYERS=OFF -DBUILD_CONFORMANCE_TESTS=OFF
          cmake --build OpenXR-SDK/build -j"$(nproc)" && cmake --install OpenXR-SDK/build

          # Static libraries
          curl -fsSL "https://github.com/madler/zlib/releases/download/v$ZLIB_VERSION/zlib-$ZLIB_VERSION.tar.gz" | tar xz
          cmake -S "zlib-$ZLIB_VERSION" -B zlib-build $CMAKE_WIN
          cmake --build zlib-build -j"$(nproc)" && cmake --install zlib-build
          # Keep only the static library, under the name that -lz looks for
          rm -f "$DEPS"/lib/libzlib.dll.a "$DEPS"/bin/libzlib.dll
          mv "$DEPS"/lib/libzlibstatic.a "$DEPS"/lib/libz.a

          curl -fsSL "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/$JPEG_TURBO_VERSION/libjpeg-turbo-$JPEG_TURBO_VERSION.tar.gz" | tar xz
          cmake -S "libjpeg-turbo-$JPEG_TURBO_VERSION" -B jpeg-build $CMAKE_WIN -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_SIMD=OFF
          cmake --build jpeg-build -j"$(nproc)" && cmake --install jpeg-build

          curl -fsSL "https://github.com/freetype/freetype/archive/refs/tags/VER-$FREETYPE_VERSION.tar.gz" | tar xz
          cmake -S "freetype-VER-$FREETYPE_VERSION" -B freetype-build $CMAKE_WIN -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_ZLIB=ON -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON
          cmake --build freetype-build -j"$(nproc)" && cmake --install freetype-build
      - name: Configure
        run: |
          DEPS="$HOME/win-deps"
          # configure looks for <host>-pkg-config, which has to find the libraries built above
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nPKG_CONFIG_LIBDIR="%s/lib/pkgconfig" exec pkg-config "$@"\n' "$DEPS" > "$HOME/bin/x86_64-w64-mingw32-pkg-config"
          chmod +x "$HOME/bin/x86_64-w64-mingw32-pkg-config"
          export PATH="$HOME/bin:$PATH"
          mkdir build && cd build
          ENGINE_FLAGS=$(printf -- '--enable-engine=%s ' $ENGINES)
          STRINGS=x86_64-w64-mingw32-strings \
          ../configure --host=x86_64-w64-mingw32 $CONFIGURE_FLAGS $ENGINE_FLAGS \
            --with-sdl-prefix="$DEPS" --with-openxr-prefix="$DEPS" --with-zlib-prefix="$DEPS" \
            --with-jpeg-prefix="$DEPS" --with-freetype2-prefix="$DEPS"
      - name: Check the configuration
        run: |
          for lib in FREETYPE2 JPEG ZLIB; do
            grep -q "^USE_$lib " build/config.mk || { echo "::error::$lib was not found by configure"; exit 1; }
          done
          for engine in $ENGINES; do
            grep -q "^ENABLE_${engine^^} " build/config.mk || { echo "::error::Engine $engine was not enabled, a dependency is missing"; exit 1; }
          done
      - name: Build
        run: make -C build -j"$(nproc)"
      - name: Package
        run: |
          DEPS="$HOME/win-deps"
          VERSION="${{ needs.version.outputs.version }}"
          cd build
          # DIST_FILES_ENGINEDATA_BIG is only fonts-cjk.dat, 38 MB of CJK fonts that are not needed
          make install-data DESTDIR="$PWD/pkg" datadir=/ docdir=/doc datarootdir=/misc mandir=/misc/man DIST_FILES_ENGINEDATA_BIG=
          rm -rf pkg/misc
          x86_64-w64-mingw32-strip -o pkg/scummvm.exe scummvm.exe
          cp "$DEPS/bin/SDL2.dll" "$DEPS/bin/libopenxr_loader.dll" /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll pkg/
          # Fail if the executable needs a DLL that is neither shipped nor part of Windows
          x86_64-w64-mingw32-objdump -p pkg/scummvm.exe | sed -n 's/.*DLL Name: //p' | sort -u | tee dlls.txt
          while read -r dll; do
            [ -e "pkg/$dll" ] || ! echo "$dll" | grep -Eiq '^(lib|SDL)' || { echo "::error::$dll is not shipped"; exit 1; }
          done < dlls.txt
          cd pkg && zip -qr "../../scummvm-$VERSION-windows-x86_64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: scummvm-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    # Dry runs from the Actions tab only build
    if: github.ref_type == 'tag'
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum scummvm-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ScummVM VR ${{ needs.version.outputs.version }}" \
            --notes "Engines with VR support in this release: $ENGINES. Source: the tag $GITHUB_REF_NAME of this repository (GPLv3+)." \
            scummvm-* SHA256SUMS
